<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בוחן: היסטולוגיה של מערכת השתן – 30 שאלות</title>
<style>
:root{--bg:#f7f5f0;--ink:#1d2430;--muted:#5c6673;--line:#e2ddd3;--accent:#2a6f97;--ok:#2a9d8f;--bad:#c1121f;--en:#1f5f8b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,"Noto Sans Hebrew",sans-serif;font-size:16px;line-height:1.55}
.top{position:sticky;top:0;z-index:20;background:#fffdf9;border-bottom:1px solid var(--line);padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top h1{font-size:19px;margin:0;flex:1 1 auto}
.top a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;background:#fff;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px;background:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
.score{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px}
.score b{font-size:18px}
.bar{flex:1 1 200px;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.q.hidden{display:none}
.q .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.q .meta span{background:#f1ede4;border-radius:999px;padding:1px 8px;margin-inline-end:6px}
.q h3{margin:0 0 10px;font-size:16.5px}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;background:#fcfbf8;font-size:15px}
.opt:hover{border-color:var(--accent)}
.q.done .opt{cursor:default}
.opt.correct{background:#e6f4f1;border-color:var(--ok);font-weight:600}
.opt.wrong{background:#fdecec;border-color:var(--bad)}
.exp{display:none;margin-top:10px;font-size:14.5px;background:#fff8ec;border:1px solid #f0d9b4;border-radius:8px;padding:8px 12px}
.q.done .exp{display:block}
.exp::before{content:"הסבר: ";font-weight:700;color:#9a5b00}
.en{direction:ltr;unicode-bidi:isolate;color:var(--en);font-weight:600;font-style:normal}
.en.plain{font-weight:400;color:inherit}
.final{background:#fff;border:2px solid var(--accent);border-radius:12px;padding:14px 18px;margin:16px 0;display:none}
</style>
</head>
<body>
<div class="top">
 <h1>בוחן: היסטולוגיה של מערכת השתן <small style="font-weight:400;color:var(--muted);font-size:13px">30 שאלות ברירה · משוב מיידי</small></h1>
 <select id="topic"><option value="all">כל הנושאים</option></select>
 <button class="btn" id="shuffle">ערבב סדר</button>
 <button class="btn" id="reset">התחל מחדש</button>
 <a href="index.html">← חזרה לסיכום</a>
</div>
<main>
 <div class="score">
  <div>נענו: <b id="answered">0</b>/<span id="total">30</span></div>
  <div>נכונות: <b id="correct" style="color:var(--ok)">0</b></div>
  <div class="bar"><i id="bar"></i></div>
  <button class="btn" id="showAll">הצג הסברים לכל השאלות</button>
 </div>
 <div id="quiz"></div>
 <div class="final" id="final"></div>
</main>

<script>
// topic keys: gross, corpuscle, tubules, jga, cd, blood, lower, epi
const Q=[
{t:'gross',q:'איזה מבנה נמצא ב-<i class="en">Renal cortex</i> ולעולם לא ב-<i class="en">Medulla</i>?',o:['<i class="en">Renal corpuscle</i>','<i class="en">TAL</i> של <i class="en">Loop of Henle</i>','<i class="en">Collecting duct</i>','Vasa recta'],a:0,e:'כל ה-<i class="en">Renal corpuscles</i> (<i class="en">Glomerulus</i> + <i class="en">Bowman\'s capsule</i>) נמצאים ב-<i class="en">Cortex</i>. זה הסימן המהיר ביותר להבדיל <i class="en">Cortex</i> מ-<i class="en">Medulla</i>: ב-<i class="en">Medulla</i> אין <i class="en">Renal corpuscles</i>.'},
{t:'gross',q:'מהי <i class="en">Renal lobule</i>?',o:['<i class="en">Pyramid</i> אחת עם ה-<i class="en">Cortex</i> שמעליה','<i class="en">Medullary ray</i> אחת עם ה-<i class="en">Labyrinth</i> ה-<i class="en">Cortical</i> שסביבה','<i class="en">Glomerulus</i> אחד עם הצינוריות שלו','<i class="en">Minor calyx</i> אחד עם ה-<i class="en">Papilla</i> שלו'],a:1,e:'<i class="en">Lobe</i> (lobe) = <i class="en">Pyramid</i> + ה-<i class="en">Cortex</i> שמעליה. <i class="en">Lobule</i> (lobule) = medullary ray אחת + ה-cortical labyrinth סביבה; במרכזה <i class="en">Collecting duct</i>.'},
{t:'gross',q:'מה מאפיין <i class="en">Nephron</i> <i class="en">Juxtamedullary</i> לעומת <i class="en">Nephron</i> <i class="en">Cortical</i>?',o:['ה-<i class="en">Renal corpuscle</i> שלו נמצא ב-<i class="en">Medulla</i>','אין לו <i class="en">Loop of Henle</i>','יש לו <i class="en">Thin ascending limb</i> והלולאה נכנסת ל-<i class="en">Medulla</i> הפנימי','הצינורית <i class="en">ה-Proximal tubule</i> שלו ארוכה יותר'],a:2,e:'ה-<i class="en">Renal corpuscle</i> תמיד ב-<i class="en">Cortex</i> (כאן קרוב לגבול <i class="en">Cortex</i>-<i class="en">Medulla</i>). הלולאה ארוכה, כוללת thin ascending limb, יורדת ל-<i class="en">Medulla</i> הפנימי ומלווה ב-vasa recta. הצינורית <i class="en">ה-Proximal tubule</i> דווקא קצרה יותר.'},
{t:'corpuscle',q:'איזה אפיתל מצפה את העלה הפריאטלי של <i class="en">Bowman\'s capsule</i>?',o:['<i class="en">Simple cuboidal</i>','<i class="en">Simple squamous</i>','<i class="en">Podocytes</i>','<i class="en">Urothelium</i>'],a:1,e:'העלה הפריאטלי הוא simple squamous. העלה הויסצרלי בנוי מ-<i class="en">Podocytes</i>. ב-<i class="en">Urinary pole</i> האפיתל הופך ל-<i class="en">Simple cuboidal</i> של ה-PCT.'},
{t:'corpuscle',q:'מהו הסדר הנכון של שכבות <i class="en">Filtration barrier</i>, מהדם אל <i class="en">Bowman\'s space</i>?',o:['GBM → <i class="en">Endothelium</i> מחורר → דיאפרגמת סדק','<i class="en">Endothelium</i> מחורר → GBM → דיאפרגמת סדק בין <i class="en">Pedicels</i>','דיאפרגמת סדק → GBM → <i class="en">Endothelium</i>','<i class="en">Podocyte</i> → <i class="en">Endothelium</i> → GBM'],a:1,e:'3 שכבות: (1) fenestrated endothelium של הנים, (2) GBM משותפת, (3) filtration slit diaphragm בין ה-pedicels של ה-<i class="en">Podocytes</i>. "3 F": Fenestrae, Fibrous GBM, Foot processes.'},
{t:'corpuscle',q:'איזו שכבה ב-<i class="en">Filtration barrier</i> עוצרת חלבונים גדולים מ-70 kDa גם לפי גודל וגם לפי מטען שלילי?',o:['ה-<i class="en">Endothelium</i> המחורר','<i class="en">Basement membrane</i> הגלומרולרית (GBM)','תאי ה-<i class="en">Mesangium</i>','העלה הפריאטלי'],a:1,e:'ה-GBM עבה (300–360 ננומטר), בנויה מקולגן IV, למינין, פיברונקטין ופרוטאוגליקנים עם GAGs פוליאניוניים. המטען השלילי דוחה חלבונים שליליים כמו אלבומין.'},
{t:'corpuscle',q:'ה-Pedicels (<i class="en">Pedicels</i>) שייכים ל:',o:['תאי <i class="en">Endothelium</i>','<i class="en">Mesangial cells</i>','<i class="en">Podocytes</i> (העלה הויסצרלי)','תאי <i class="en">Macula densa</i>'],a:2,e:'<i class="en">Podocyte</i> = גוף תא → זיזים ראשוניים → זיזים שניוניים (pedicels) שיושבים על ה-GBM. ביניהם <i class="en">Filtration slits</i> (~30 ננומטר) עם slit diaphragm (nephrin).'},
{t:'corpuscle',q:'מה מהבאים הוא תפקיד של התאים ה-<i class="en">Mesangial</i>?',o:['הפרשת <i class="en">Renin</i>','סינון חלבונים קטנים','תמיכה בנימים, כיווץ ופגוציטוזה של אגרגטים','ספיגת מים בתגובה ל-ADH'],a:2,e:'תאים דמויי-פריציטים בין הנימים: תמיכה פיזית, כיווץ (ויסות GFR), פגוציטוזה של חלבונים שנתקעו ב-GBM, והפרשת ציטוקינים/פרוסטגלנדינים. <i class="en">Renin</i> מופרש מתאי JG.'},
{t:'corpuscle',q:'איפה נמצאים <i class="en">Vascular pole</i> ו-<i class="en">Urinary pole</i> של ה-<i class="en">Renal corpuscle</i>?',o:['באותו צד של ה-<i class="en">Renal corpuscle</i>','בצדדים מנוגדים; ב-<i class="en">Urinary pole</i> מתחיל ה-PCT','<i class="en">Urinary pole</i> בתוך ה-<i class="en">Glomerulus</i>','אין קטבים ל-<i class="en">Renal corpuscle</i>'],a:1,e:'ב-<i class="en">Vascular pole</i> (vascular pole) נכנס ה-<i class="en">Afferent arteriole</i> ויוצא המוליך, ושם צמודים גם macula densa ותאי JG. ב-<i class="en">Urinary pole</i> (urinary/tubular pole) ה-<i class="en">Bowman\'s capsule</i> ממשיכה ל-PCT.'},
{t:'tubules',q:'צינורית ב-<i class="en">Cortex</i> עם ציטופלסמה אצידופילית מאוד, לומן "מלא פלומה" ומעט גרעינים בחתך. מהי?',o:['<i class="en">DCT</i>','<i class="en">Collecting duct</i>','<i class="en">PCT</i>','<i class="en">Thin limb</i> של <i class="en">Loop of Henle</i>'],a:2,e:'PCT: הרבה <i class="en">Mitochondria</i> (ורוד עמוק), brush border (לומן מטושטש/סתום), תאים גדולים ולכן מעט גרעינים בחתך. "P = Pink, Plush, Paucity of nuclei".'},
{t:'tubules',q:'מה מבדיל DCT מ-PCT בחתך H&E?',o:['ל-DCT יש <i class="en">Brush border</i> בולט','DCT ורודה יותר','ל-DCT לומן פתוח ונקי, תאים נמוכים יותר, והרבה יותר גרעינים בחתך','DCT נמצאת רק ב-<i class="en">Medulla</i>'],a:2,e:'DCT: בלי brush border (לומן ריק), תאים קטנים וחיוורים (פחות <i class="en">Mitochondria</i>), ולכן נספרים הרבה יותר גרעינים בחתך. "התשובה בגרעינים".'},
{t:'tubules',q:'איזה אפיתל מצפה את ה-<i class="en">Thin limbs</i> של <i class="en">Loop of Henle</i>?',o:['<i class="en">Simple cuboidal</i> עם <i class="en">Brush border</i>','<i class="en">Simple squamous</i>','<i class="en">Simple columnar</i>','<i class="en">Urothelium</i>'],a:1,e:'ה-<i class="en">Thin limbs</i> (יורדת ועולה) בנויות simple squamous עם מעט <i class="en">Mitochondria</i>, מתאים למעבר פסיבי. הן נראות כמעט כמו נימים.'},
{t:'tubules',q:'ב-<i class="en">Medulla</i> רואים שני צינורות דקים ודומים. איך מבדילים <i class="en">Thin limb</i> של הנלה מ-vasa recta?',o:['ל-vasa recta יש <i class="en">Brush border</i>','בזרוע הדקה יש כדוריות אדומות','ב-vasa recta יש כדוריות אדומות בלומן','אי אפשר להבדיל'],a:2,e:'שניהם מצופים תאים שטוחים. הסימן המכריע הוא תוכן הלומן: RBC = כלי דם. גרעיני ה-<i class="en">Endothelium</i> גם שטוחים יותר.'},
{t:'tubules',q:'מה מאפיין את ה-<i class="en">Ascending limb</i> העבה (TAL)?',o:['<i class="en">Simple squamous</i>, חדירה גבוהה למים','<i class="en">Simple cuboidal</i> בלי <i class="en">Brush border</i>, הרבה <i class="en">Mitochondria</i>, שאיבה אקטיבית של Na⁺ ואטימות למים','<i class="en">Cuboidal</i> עם <i class="en">Brush border</i>, ספיגת גלוקוז','<i class="en">Simple columnar</i> עם <i class="en">Umbrella cells</i>'],a:1,e:'TAL שואבת NaCl אקטיבית החוצה בלי לתת למים לעבור, ולכן מדללת את ה-<i class="en">Filtrate</i> ובונה את המפל ההיפרטוני ב-<i class="en">Medulla</i>. היא מסתיימת ב-macula densa.'},
{t:'tubules',q:'ב-<i class="en">Medullary ray</i> שלושה צינורות ישרים זה לצד זה. איזה מהם הכי חיוור, עם גבולות תאים חדים?',o:['<i class="en">PST</i>','<i class="en">TAL</i>','<i class="en">Collecting duct</i> (CD)','כולם זהים'],a:2,e:'לפי "כמה ורוד": PST (ורוד, <i class="en">Brush border</i>) > TAL (בינוני, לומן נקי, יותר גרעינים) > CD (חיוור, "אריחים", לומן גדול).'},
{t:'tubules',q:'איזה מהבאים הוא תפקיד של ה-PCT?',o:['ספיגת 100% מהגלוקוז וחומצות האמינו ו-2/3 מהמים והנתרן','ספיגת מים בתגובה ל-ADH','הפרשת <i class="en">Renin</i>','חישת ריכוז Na⁺ בלומן'],a:0,e:'ה-PCT היא "תחנת הכוח": 2/3 מהמים, Na⁺, Cl⁻; כל הגלוקוז וחומצות האמינו; רוב ה-HCO₃⁻. גם מפרישה קריאטינין, חומצת שתן ותרופות.'},
{t:'jga',q:'איפה בדיוק נמצאת ה-Macula densa?',o:['בדופן ה-PCT ליד <i class="en">Urinary pole</i>','בדופן תחילת ה-DCT, צמודה ל-<i class="en">Afferent arteriole</i> ב-<i class="en">Vascular pole</i>','בתוך ה-<i class="en">Glomerulus</i>','בדופן ה-<i class="en">Collecting duct</i>'],a:1,e:'ה-TAL חוזרת ל-<i class="en">Renal corpuscle</i> שלה ונוגעת ב-<i class="en">Afferent arteriole</i>; שם תאי הדופן נעשים גבוהים וצפופים = macula densa. זה גם מסמן את תחילת ה-DCT.'},
{t:'jga',q:'מי מפריש <i class="en">Renin</i>?',o:['תאי <i class="en">Macula densa</i>','תאי Lacis','תאי JG (גרנולריים): <i class="en">Smooth muscle cells</i> ששונו בדופן ה-<i class="en">Afferent arteriole</i>','תאי <i class="en">Endothelium</i> של ה-<i class="en">Glomerulus</i>'],a:2,e:'תאי JG = <i class="en">Smooth muscle cells</i> של הטוניקה מדיה ב-<i class="en">Afferent arteriole</i> שהפכו לתאי הפרשה עם גרגירי <i class="en">Renin</i>. בצביעה אימונית ל-<i class="en">Renin</i> הם נצבעים.'},
{t:'jga',q:'עלייה בזרימת Na⁺ ב-<i class="en">Macula densa</i> (GFR גבוה) גורמת ל:',o:['הפרשת ATP/אדנוזין, כיווץ ה-<i class="en">Afferent arteriole</i> וירידה בהפרשת <i class="en">Renin</i>','הפרשת PGE₂/NO והרחבת ה-<i class="en">Afferent arteriole</i>','עלייה בהפרשת <i class="en">Renin</i>','כיווץ ה-<i class="en">Efferent arteriole</i> בלבד'],a:0,e:'TG feedback: הרבה מלח = GFR גבוה מדי → ATP/אדנוזין → כיווץ afferent → GFR יורד; במקביל <i class="en">Renin</i> יורד. מעט מלח → PGE₂/NO → הרחבה ו-<i class="en">Renin</i> עולה.'},
{t:'jga',q:'איזה מהבאים מגביר הפרשת <i class="en">Renin</i>?',o:['עלייה בלחץ ב-<i class="en">Afferent arteriole</i>','עלייה בזרימת Na⁺ ב-<i class="en">Macula densa</i>','גירוי סימפתטי דרך רצפטור β₁ בתאי JG','עלייה בנפח הדם'],a:2,e:'"סימפתטי מעלה; לחץ ומלח מורידים". נוראפינפרין על β₁ מגביר <i class="en">Renin</i>; לחץ גבוה ב-<i class="en">Arteriole</i> (<i class="en">Baroreceptor</i>) ומלח רב ב-MD מדכאים.'},
{t:'cd',q:'איזה תא ב-<i class="en">Collecting duct</i> מגיב ל-ADH באמצעות Aquaporin-2?',o:['<i class="en">Intercalated cell</i> (Intercalated) סוג A','<i class="en">Principal cell</i> (Principal)','<i class="en">Umbrella cell</i>','תא <i class="en">Macula densa</i>'],a:1,e:'התאים העיקריים (~70%, חיוורים, גבולות ברורים) מכניסים AQP2 לממברנה האפיקלית בנוכחות ADH, והמים יוצאים אל ה-<i class="en">Medulla</i> ההיפרטוני ול-vasa recta.'},
{t:'cd',q:'<i class="en">Intercalated cell</i> מסוג A (Type A intercalated cell):',o:['מפריש H⁺','מפריש HCO₃⁻','סופג מים','מפריש <i class="en">Renin</i>'],a:0,e:'סוג A מפריש H⁺ (מתקן חמצת), סוג B מפריש HCO₃⁻ (מתקן בססת). התאים המשולבים כהים יותר, עשירים ב-<i class="en">Mitochondria</i>, ויש להם קפלים אפיקליים.'},
{t:'cd',q:'הצינורות הפפילריים (ducts of Bellini) נשפכים אל:',o:['ה-<i class="en">Renal pelvis</i> ישירות','<i class="en">Minor calyx</i> (minor calyx), ושם האפיתל מתחלף ל-<i class="en">Urothelium</i>','ה-<i class="en">Ureter</i>','<i class="en">Major calyx</i>'],a:1,e:'בקודקוד ה-<i class="en">Pyramid</i> (area cribrosa) הצינורות הפפילריים נפתחים אל <i class="en">Minor calyx</i>. האפיתל ה-<i class="en">Columnar</i> של ה-CD הופך בבת אחת ל-urothelium.'},
{t:'blood',q:'מהו הסדר הנכון של העורקים מ-<i class="en">Renal artery</i> ועד ה-<i class="en">Afferent arteriole</i>?',o:['Renal → Arcuate → Interlobar → Interlobular → Afferent','Renal → Segmental → Interlobar → Arcuate → Interlobular → Afferent','Renal → Interlobular → Arcuate → Interlobar → Afferent','Renal → Segmental → Arcuate → Interlobar → Afferent'],a:1,e:'Really Smart Interns Always Identify Arterioles. Interlobar ב-<i class="en">Renal columns</i> בין ה-<i class="en">Pyramids</i> → Arcuate על בסיס ה-<i class="en">Pyramid</i> → Interlobular (cortical radiate) עולים ב-<i class="en">Cortex</i>.'},
{t:'blood',q:'מאיפה יוצאים ה-Vasa recta?',o:['מ-<i class="en">Afferent arteriole</i>','מ-<i class="en">Efferent arteriole</i> של <i class="en">Nephrons</i> <i class="en">Juxtamedullary</i>ים','מ-<i class="en">Arcuate arteries</i> ישירות','מ-<i class="en">Peritubular capillaries</i> של <i class="en">Nephrons</i> <i class="en">Cortical</i>'],a:1,e:'ה-<i class="en">Efferent arteriole</i> של <i class="en">Nephron</i> <i class="en">Cortical</i> → <i class="en">Peritubular capillaries</i>. של <i class="en">Nephron</i> <i class="en">Juxtamedullary</i> → vasa recta שיורדים ל-<i class="en">Medulla</i> ושומרים על המפל ההיפרטוני בחילוף זרם-נגדי.'},
{t:'lower',q:'מה מאפיין את <i class="en">Umbrella cells</i>?',o:['תאים קטנים בשכבה הבזלית','תאים גדולים בשכבה השטחית, לעיתים דו-גרעיניים, עם <i class="en">Plaques</i> של uroplakin','תאים <i class="en">Columnar</i> עם ריסים','תאים <i class="en">Squamous</i> מקורננים'],a:1,e:'<i class="en">Umbrella cells</i> (עד 100 מיקרון) מכסים כמה תאי ביניים. הממברנה האפיקלית א-סימטרית (AUM) עם <i class="en">Plaques</i> נוקשים של uroplakins, ויחד עם tight junctions יוצרת מחסום אוסמוטי.'},
{t:'lower',q:'מה קורה ל-<i class="en">Urothelium</i> של ה-<i class="en">Bladder</i> כשהיא מתמלאת?',o:['מספר השכבות עולה מ-2–3 ל-5–7','הוא נעשה דק יותר: מ-5–7 שכבות ל-2–3, והבועיות עם ה-<i class="en">Plaques</i> מתמזגות לממברנה האפיקלית','הוא עובר מטאפלזיה ל-<i class="en">Squamous</i>','הוא מתקלף ומתחדש'],a:1,e:'ב-<i class="en">Bladder</i> מלאה הקפלים נעלמים, תאי הביניים זזים הצידה, העובי יורד לחצי, ו-<i class="en">Umbrella cells</i> פורשים את ה-<i class="en">Plaques</i> ששמרו בבועיות.'},
{t:'lower',q:'איזו שכבה חסרה בדופן ה-<i class="en">Ureter</i> אבל קיימת ב-<i class="en">Bladder</i>?',o:['<i class="en">Urothelium</i>','Lamina propria','<i class="en">Submucosa</i>','<i class="en">Adventitia</i>'],a:2,e:'<i class="en">Ureter</i>: <i class="en">Urothelium</i>, lamina propria, שריר (2 שכבות: אורכית פנימית והיקפית חיצונית), <i class="en">Adventitia</i>. בלי <i class="en">Submucosa</i>. <i class="en">Bladder</i>: גם <i class="en">Submucosa</i> ו-<i class="en">Detrusor</i> של 3 שכבות. ה-<i class="en">Ureter</i> מזוהה גם בלומן הכוכבי.'},
{t:'lower',q:'איזה אפיתל מצפה את ה-<i class="en">Urethra</i> הממברנוזית בגבר?',o:['<i class="en">Urothelium</i>','<i class="en">Keratinized stratified squamous</i>','<i class="en">Stratified columnar</i> / <i class="en">Pseudostratified columnar</i>','<i class="en">Simple cuboidal</i>'],a:2,e:'T-C-C-S: פרוסטטית = Transitional; ממברנוזית וספוגית = stratified/pseudostratified Columnar; הקצה = stratified Squamous. הממברנוזית עוברת ב-<i class="en">External striated sphincter</i>.'},
{t:'lower',q:'מהו האפיתל ברוב אורכה של ה-<i class="en">Urethra</i> הנשית?',o:['<i class="en">Urothelium</i> לכל האורך','<i class="en">Non-keratinized stratified squamous</i>, המשך לעור השפתיים הקטנות','<i class="en">Simple columnar</i>','<i class="en">Stratified cuboidal</i>'],a:1,e:'ה-<i class="en">Urethra</i> הנשית (3–5 ס"מ) מתחילה ב-<i class="en">Urothelium</i> ועוברת במהירות ל-non-keratinized stratified squamous. היא איבר שתן בלבד, מוקפת בחלקה האמצעי בסוגר משורטט.'},
];

const topicNames={gross:'מבנה כללי',corpuscle:'Renal corpuscle ו-Filtration barrier',tubules:'זיהוי צינוריות',jga:'JGA ו-RAAS',cd:'Collecting duct',blood:'אספקת דם',lower:'דרכי השתן'};
let order=Q.map((_,i)=>i), state={};
const sel=document.getElementById('topic');
Object.keys(topicNames).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=topicNames[k]+' ('+Q.filter(q=>q.t===k).length+')';sel.appendChild(o);});

function render(){
  const root=document.getElementById('quiz');root.innerHTML='';
  order.forEach((qi,n)=>{
    const q=Q[qi];const d=document.createElement('div');d.className='q'+(state[qi]!==undefined?' done':'');d.dataset.t=q.t;d.dataset.i=qi;
    let h='<div class="meta"><span>'+(n+1)+'/'+Q.length+'</span><span>'+topicNames[q.t]+'</span></div><h3>'+q.q+'</h3><div class="opts">';
    q.o.forEach((o,k)=>{let c='opt';if(state[qi]!==undefined){if(k===q.a)c+=' correct';else if(k===state[qi])c+=' wrong';}h+='<div class="'+c+'" data-k="'+k+'">'+o+'</div>';});
    h+='</div><div class="exp">'+q.e+'</div>';d.innerHTML=h;root.appendChild(d);
  });
  root.querySelectorAll('.q:not(.done) .opt').forEach(el=>el.addEventListener('click',onPick));
  filter();updateScore();
}
function onPick(e){
  const qd=e.target.closest('.q');const qi=+qd.dataset.i;const k=+e.target.dataset.k;
  if(state[qi]!==undefined)return;state[qi]=k;qd.classList.add('done');
  qd.querySelectorAll('.opt').forEach(o=>{const kk=+o.dataset.k;if(kk===Q[qi].a)o.classList.add('correct');else if(kk===k)o.classList.add('wrong');o.removeEventListener('click',onPick);});
  updateScore();
}
function updateScore(){
  const n=Object.keys(state).length;const c=Object.keys(state).filter(i=>state[i]===Q[i].a).length;
  document.getElementById('answered').textContent=n;document.getElementById('correct').textContent=c;
  document.getElementById('bar').style.width=(100*c/Q.length)+'%';
  const f=document.getElementById('final');
  if(n===Q.length){f.style.display='block';const pct=Math.round(100*c/Q.length);
    f.innerHTML='<b>סיימת! '+c+'/'+Q.length+' ('+pct+'%)</b><br>'+(pct>=85?'מצוין, אתם מוכנים.':pct>=70?'טוב. עברו שוב על ההסברים בשאלות שטעיתם בהן.':'כדאי לחזור לסיכום ולעשות את הבוחן שוב.');
    const wrong=Object.keys(state).filter(i=>state[i]!==Q[i].a).map(i=>Q[i].t);
    if(wrong.length){const cnt={};wrong.forEach(t=>cnt[t]=(cnt[t]||0)+1);f.innerHTML+='<br>נושאים לחיזוק: '+Object.keys(cnt).map(t=>topicNames[t]+' ('+cnt[t]+')').join(', ');}
  } else f.style.display='none';
}
function filter(){const t=sel.value;document.querySelectorAll('.q').forEach(d=>d.classList.toggle('hidden',t!=='all'&&d.dataset.t!==t));}
sel.addEventListener('change',filter);
document.getElementById('shuffle').addEventListener('click',()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}render();window.scrollTo(0,0);});
document.getElementById('reset').addEventListener('click',()=>{state={};render();window.scrollTo(0,0);});
document.getElementById('showAll').addEventListener('click',()=>{document.querySelectorAll('.q').forEach(d=>d.classList.add('done'));});
document.getElementById('total').textContent=Q.length;
render();
</script>
</body>
</html>
